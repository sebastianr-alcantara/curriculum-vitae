<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV - Sebastián Alcántara</title>
    <link rel="icon" href="recursos/imagenes/profile-photo.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="contenedor" class="contenedor">
        <header class="header">
            <img class="profile" src="recursos/imagenes/profile-photo.png">
            <div class="professional">
                <span class="name">Sebastián Alcántara</span>
                <span class="career">Ingeniero Geógrafo</span>
                <span class="specialization">GIS | Drenaje Pluvial | Inmobiliario</span>
            </div>
            <div class="social">
                <div class="media">
                    <button class="linkedin" onclick="window.open('https://linkedin.com/in/sebastian-alcantara', '_blank')">
                        <i class="fa-brands fa-linkedin-in"></i>
                    </button>
                    <button class="github" onclick="window.open('https://github.com/sebastianr-alcantara', '_blank')">
                        <i class="fa-brands fa-github"></i>
                    </button>
                    <button class="mail" onclick="window.location.href='mailto:sebastianr.alcantara@gmail.com'">
                        <i class="fa-solid fa-envelope"></i>
                    </button>
                </div>
                <div class="location">
                    <span class="material-symbols-outlined">location_on</span>
                    <span>Lima, Perú</span>
                </div>
            </div>
        </header>
        <main class="main">
            <div id="sec-summary" class="section" state="activated">
                <span class="title">Resumen Profesional</span>
                <span class="about-me"></span>
                <div class="interactive">
                    <div class="summary-modal" style="display: none;">
                        <div class="modal-header">
                            <span id="icon-location-header-summary-modal" class="material-symbols-outlined">location_on</span>
                            <div class="title-header">MI EXPERIENCIA AQUÍ</div>
                            <span id="close-header-summary-modal" class="material-symbols-outlined">close</span>
                        </div>
                        <div class="modal-body"></div>
                    </div>
                    <div class="map">
                        <div id="map-summary" class="geovisor"></div>
                        <div class="legend">
                            <div id="experiencie-class" class="class">
                                <div class="symbol"></div>
                                <div class="description">
                                    Departamentos relacionados a donde he laborado
                                </div>
                            </div>
                            <div id="unexperiencie-class" class="class">
                                <div class="symbol"></div>
                                <div class="description">
                                    Otros departamentos donde podría laborar
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="sec-education" class="section" state="deactivated">
                Educacion
            </div>
            <div id="sec-experience" class="section" state="deactivated">
                Experiencia
            </div>
        </main>
        <footer class="footer">
            <button id="btn-summary">Resumen</button>
            <button id="btn-education">Educación</button>
            <button id="btn-experience">Experiencia</button>
        </footer>
    </div>
    <!-- Datos -->
    <script src="recursos/datos/inei-departamentos.js"></script>
    <script src="recursos/datos/inei-provincias.js"></script>
    <script src="recursos/datos/sral-informacion.js"></script>
    <!-- Librerias -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Logica -->
    <script src="index.js"></script>
</body>
</html>
